<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورک‌بوک ۲۱ روزه CIP</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F9FF;--card:#FFFFFF;--peach:#E6F2FE;--apr:#D3E8FC;--coral:#2379D4;--gold:#3A9AEE;--ink:#1F3A56;--mute:#5F7D9A;--line:#D3E4F5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B2A;--card:#17273A;--peach:#1E3550;--apr:#24405F;--coral:#7CC0FF;--gold:#4FA6F5;--ink:#E8F3FF;--mute:#9DB8D4;--line:#2E4A68}}
:root[data-theme="dark"]{--bg:#0F1B2A;--card:#17273A;--peach:#1E3550;--apr:#24405F;--coral:#7CC0FF;--gold:#4FA6F5;--ink:#E8F3FF;--mute:#9DB8D4;--line:#2E4A68}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 60px}
h1,h2{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;margin:0}
.top{background:linear-gradient(160deg,var(--apr),var(--peach));border-radius:22px;padding:18px;margin-bottom:12px}
.top h1{font-size:30px;line-height:1.3}
.top small{color:var(--mute)}
.bar{height:10px;background:rgba(255,255,255,.55);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width .4s}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin-bottom:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.chip{flex:0 0 auto;min-width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 14px Vazirmatn,sans-serif;cursor:pointer}
.chip.wide{border-radius:20px;padding:0 14px}
.chip.part{border-color:var(--gold)}
.chip.done{background:var(--gold);border-color:var(--gold);color:#fff}
.chip.on{outline:3px solid var(--coral);outline-offset:1px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.p{background:var(--peach);border-color:transparent}
.card h3{margin:0 0 6px;font-size:16px;color:var(--coral)}
.head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.sun{flex:0 0 auto;width:68px;height:68px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font:400 17px Lalezar,sans-serif;text-align:center;line-height:1.2;box-shadow:0 0 0 6px rgba(58,154,238,.22)}
.head h2{font-size:26px;line-height:1.3}
.head p{margin:0;color:var(--mute);font-style:italic;font-size:14px}
textarea,input[type=text],input[type=number]{width:100%;font:400 15px/1.9 Vazirmatn,sans-serif;color:var(--ink);background:repeating-linear-gradient(transparent 0 28px,var(--line) 28px 29px);border:0;border-radius:12px;padding:6px 12px;resize:vertical;margin-top:6px}
input[type=text],input[type=number]{background:var(--bg);border:1.5px solid var(--line);padding:6px 12px}
textarea{background-color:var(--card);border:1.5px dashed var(--line)}
textarea:focus,input:focus{outline:2px solid var(--coral)}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer;font-size:15px}
.ck input{appearance:none;width:26px;height:26px;border:2px solid var(--gold);border-radius:8px;flex:0 0 auto;display:grid;place-items:center;margin:0;cursor:pointer;background:var(--card)}
.ck input:checked{background:var(--gold)}
.ck input:checked::after{content:"✓";color:#fff;font-size:16px;font-weight:700}
.ck input:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.night{background:var(--apr)}
.night h3{color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:14px;color:var(--mute);margin-top:8px}
.grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:6px;align-items:center}
.grid .chip{width:100%;min-width:0}
.btns{display:flex;gap:8px;justify-content:space-between;margin-top:6px}
.btn{border:0;border-radius:14px;padding:10px 18px;font:500 15px Vazirmatn,sans-serif;background:var(--coral);color:#fff;cursor:pointer}
.btn.g{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.saved{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s}
.saved.on{opacity:.9}
ul.r{margin:6px 0 0;padding-inline-start:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>ورک‌بوک ۲۱ روزه</h1>
    <small>CIP | کد ۴ — سحرخیزی | روتین | نظم | انرژی | ذهنیت ثروت‌ساز</small>
    <div class="bar"><i id="pb"></i></div>
    <small id="pt"></small>
  </div>
  <nav class="nav" id="nav" aria-label="روزها"></nav>
  <main id="main"></main>
</div>
<div class="saved" id="saved">ذخیره شد</div>
<script>
const D=[
["نقطه شروع من","قبل از تغییر، باید بدانم کجا ایستاده‌ام.","ساعت خواب و بیداری فعلی‌ات را ثبت کن و بنویس چرا وارد CIP شدی.","اگر این ۲۱ روز موفق باشد، چه چیزی در زندگی من باید تغییر کرده باشد؟"],
["خواب؛ پایه سحرخیزی","صبح خوب، از شب قبل ساخته می‌شود.","سه عامل که خوابم را خراب می‌کند و یک تغییر کوچک برای امشب را بنویس.","امشب چه ساعتی می‌خوابم؟ چه چیزی را ۳۰ دقیقه قبل از خواب کنار می‌گذارم؟"],
["صبح من چگونه شروع می‌شود؟","اولین دقایق صبح، جهت روز را تعیین می‌کنند.","یک روتین صبح ۲۰ تا ۳۰ دقیقه‌ای طراحی کن.","سه کار اول من بعد از بیدار شدن: ۱) ... ۲) ... ۳) ..."],
["روتین شب","برای بیدار شدن، باید شب را مدیریت کنیم.","چک‌لیست روتین شب خودت را بساز.","امشب چه ساعتی موبایل را کنار می‌گذارم؟"],
["مهم‌ترین کار روز","سحرخیزی بدون هدف، فقط زود بیدار شدن است.","سه کار مهم فردا را بنویس و فقط یکی را به عنوان MIT انتخاب کن.","مهم‌ترین کار فردای من چیست و چرا؟"],
["مدیریت انرژی","همه ساعت‌ها ارزش یکسان ندارند.","سه کاری که انرژی‌ات را می‌گیرند و سه کاری که انرژی می‌دهند بنویس.","فردا زمان پرانرژی‌ام را به چه کاری اختصاص می‌دهم؟"],
["مرور هفته اول","قرار نیست کامل باشیم؛ قرار است آگاه‌تر شویم.","هفته اول را با امتیاز ۱ تا ۱۰ ارزیابی کن.","چه چیزی را باید ادامه بدهم؟ چه چیزی را باید تغییر بدهم؟"],
["عادت‌سازی","عادت با تکرار کوچک و قابل‌اجرا ساخته می‌شود.","یک عادت کوچک صبحگاهی انتخاب کن و محرک، رفتار و پاداشش را بنویس.","نسخه حداقلی عادت من در روزهای سخت چیست؟"],
["مبارزه با تعلل","اقدام کوچک، بهتر از برنامه بزرگ اجرا نشده است.","یک کار عقب‌افتاده را به یک اقدام ۱۵ دقیقه‌ای تبدیل کن.","امروز فقط ۱۵ دقیقه برای چه کاری اقدام می‌کنم؟"],
["تمرکز","تمرکز یعنی انتخاب کردن به چه چیزی «نه» بگوییم.","سه عامل حواس‌پرتی اصلی‌ات را بنویس و برای یکی راه‌حل بگذار.","امروز یک بازه ۳۰ تا ۶۰ دقیقه‌ای بدون حواس‌پرتی دارم."],
["ذهنیت رشد","من قرار نیست همان آدم قبلی بمانم.","یک باور محدودکننده درباره خودت را بنویس و نسخه توانمندکننده‌تر آن را بساز.","اگر باور کنم می‌توانم، امروز چه اقدامی انجام می‌دهم؟"],
["ذهنیت ثروت‌ساز ۱","پول فقط عدد نیست؛ رابطه ما با ارزش‌آفرینی هم هست.","سه باور خودت درباره پول و درآمد را بنویس و بررسی کن کدام‌یک کمکت می‌کند و کدام‌یک مانعت می‌شود.","یک باور مالی که می‌خواهم از امروز بازنویسی کنم: ..."],
["ذهنیت ثروت‌ساز ۲","به جای فقط خواستن درآمد بیشتر، به ارزش بیشتری فکر کن.","۱۰ مهارت یا توانمندی که بلدی یا به آن علاقه داری بنویس.","کدام مهارت من می‌تواند برای دیگران ارزش ایجاد کند؟"],
["مرور هفته دوم","استمرار، نتیجه روزهای معمولی است.","سه پیشرفت واقعی دو هفته اخیر را ثبت کن.","اگر فقط یک چیز را در هفته سوم بهتر کنم، آن چیست؟"],
["صبح برای رشد","زمان صبح می‌تواند سرمایه شخصی تو باشد.","یک برنامه ۴۵ تا ۹۰ دقیقه‌ای برای رشد خودت طراحی کن.","صبح فردا روی کدام مهارت یا هدف کار می‌کنم؟"],
["اقدام پول‌ساز","بین مشغول بودن و درآمدساز بودن تفاوت وجود دارد.","۱۰ اقدام پول‌ساز بنویس که می‌توانی در حوزه خودت انجام دهی.","امروز کدام اقدام مستقیماً مرا به درآمد نزدیک‌تر می‌کند؟"],
["اعتماد به خود","اعتمادبه‌نفس از عمل کردن ساخته می‌شود.","سه کاری را بنویس که قبلاً فکر می‌کردی نمی‌توانی اما انجام دادی.","امروز برای اثبات توانمندی‌ام به خودم چه می‌کنم؟"],
["مدیریت روزهای سخت","روز بد، پایان مسیر نیست.","برای روزهای کم‌انرژی یک «روتین حداقلی» طراحی کن.","اگر فردا خیلی خسته باشم، حداقل چه کارهایی را انجام می‌دهم؟"],
["هویت جدید من","رفتارهای تکراری، هویت جدید می‌سازند.","جمله را کامل کن: «من زنی هستم که...» و حداقل ۵ ویژگی بنویس.","امروز چه رفتاری انجام می‌دهم که با هویت جدیدم هماهنگ باشد؟"],
["سیستم ادامه مسیر","۲۱ روز پایان نیست؛ شروع تثبیت است.","سه عادت اصلی که می‌خواهی بعد از CIP ادامه دهی مشخص کن و برای هرکدام زمان و محرک تعیین کن.","برای ۳۰ روز آینده چه سیستمی دارم؟"],
["من بعد از CIP","حالا باید نتیجه را به مسیر تبدیل کنیم.","قبل و بعد خودت را مقایسه کن؛ از خواب و انرژی تا نظم، تمرکز و ذهنیت.","تعهد من برای ۹۰ روز آینده چیست؟"]
];
const CK=["در ساعت هدف بیدار شدم.","تا انجام روتین اولیه سراغ موبایل نرفتم.","مهم‌ترین کار روزم را مشخص کردم.","حداقل یک اقدام مهم را انجام دادم."];
const RULES=["هر روز تمرین همان روز را انجام می‌دهم؛ حتی اگر کامل نباشد.","اگر یک روز از دست رفت، از روز بعد ادامه می‌دهم و دوره را رها نمی‌کنم.","صبح‌ها قبل از غرق شدن در موبایل، مهم‌ترین کار روزم را مشخص می‌کنم.","شب‌ها کوتاه مرور می‌کنم: چه چیزی خوب بود و فردا چه چیزی را بهتر می‌کنم؟","هدف من کامل بودن نیست؛ هدف من ساختن استمرار است."];
const SUM=[["s.sleep0","میانگین ساعت خواب من قبل از CIP"],["s.wake0","میانگین ساعت بیداری من قبل از CIP"],["s.wake1","میانگین ساعت بیداری من در پایان CIP"],["s.en0","سطح انرژی من قبل از CIP از ۱۰"],["s.en1","سطح انرژی من در پایان CIP از ۱۰"],["s.or0","نظم شخصی من قبل از CIP از ۱۰"],["s.or1","نظم شخصی من در پایان CIP از ۱۰"],["s.change","مهم‌ترین تغییری که در خودم دیدم"],["s.habit","عادت اصلی که می‌خواهم ادامه بدهم"],["s.goal","مهم‌ترین هدف مالی/کاری ۹۰ روز آینده"]];
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const KEY="cip21-workbook-v1";
let S={},view="home",tm;
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
const s=document.getElementById("saved");s.classList.add("on");setTimeout(()=>s.classList.remove("on"),900)},350)}
const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const cnt=n=>[0,1,2,3].filter(i=>S[`d${n}.c${i}`]).length;
const st=n=>cnt(n)===4?"done":cnt(n)>0?"part":"";
function refresh(){
  let done=0;for(let n=1;n<=21;n++)if(cnt(n)===4)done++;
  document.getElementById("pb").style.width=(done/21*100)+"%";
  document.getElementById("pt").textContent=fa(done)+" روز از ۲۱ روز کامل شده";
  const nav=document.getElementById("nav");
  nav.innerHTML=`<button class="chip wide ${view==="home"?"on":""}" data-v="home">شروع</button>`+
   D.map((_,i)=>`<button class="chip ${st(i+1)} ${view===i+1?"on":""}" data-v="${i+1}" aria-label="روز ${fa(i+1)}">${fa(i+1)}</button>`).join("")+
   `<button class="chip wide ${view==="sum"?"on":""}" data-v="sum">جمع‌بندی</button>`;
}
function tx(k,rows,ph){return `<textarea data-k="${k}" rows="${rows}" placeholder="${ph||""}">${esc(S[k])}</textarea>`}
function inp(k,t,ph){return `<input type="${t||"text"}" data-k="${k}" value="${esc(S[k])}" placeholder="${ph||""}">`}
function home(){
  let g="";
  for(let w=0;w<3;w++){g+=`<b>هفته ${fa(w+1)}</b>`;for(let d=1;d<=7;d++){const n=w*7+d;g+=`<button class="chip ${st(n)}" data-v="${n}">${fa(d)}</button>`}}
  return `<div class="card p"><h3>نام و نام خانوادگی</h3>${inp("name")}
  <h3 style="margin-top:12px">هدف اصلی من در این ۲۱ روز</h3>${tx("goal",3)}</div>
  <div class="card"><h2 style="font-size:22px">چطور از این ورک‌بوک استفاده کنم؟</h2>
  <p>این ورک‌بوک قرار نیست فقط پر شود؛ قرار است هر روز چند دقیقه تو را وادار کند مکث کنی، انتخاب کنی و اقدام کنی.</p>
  <h3>قانون‌های ۲۱ روز:</h3>${RULES.map((r,i)=>`<label class="ck"><input type="checkbox" data-k="rule${i}" ${S["rule"+i]?"checked":""}><span>${r}</span></label>`).join("")}</div>
  <div class="card"><h2 style="font-size:22px;margin-bottom:10px">ردیابی کلی ۲۱ روز</h2><div class="grid"><span></span>${[1,2,3,4,5,6,7].map(d=>`<small style="text-align:center">روز ${fa(d)}</small>`).join("")}${g.replace(/<b>(.*?)<\/b>/g,'<b style="font-size:13px">$1</b>')}</div>
  <small style="color:var(--mute)">دایره طلایی‌توخالی یعنی بخشی از برنامه صبح انجام شده؛ پر یعنی هر ۴ مورد تیک خورده.</small></div>
  <div class="btns"><span></span><button class="btn" data-v="1">شروع روز ۱</button></div>`;
}
function day(n){
  const [t,q,ex,ni]=D[n-1],k=x=>`d${n}.${x}`;
  return `<div class="head"><div class="sun">روز<br>${fa(n)}</div><div><h2>${t}</h2><p>${q}</p></div></div>
  <div class="card p"><h3>تمرین امروز</h3><div>${ex}</div><label class="f">پاسخ من</label>${tx(k("ans"),6)}</div>
  <div class="card"><h3>برنامه صبح امروز</h3>${CK.map((c,i)=>`<label class="ck"><input type="checkbox" data-k="${k("c"+i)}" ${S[k("c"+i)]?"checked":""}><span>${c}</span></label>`).join("")}</div>
  <div class="card night"><h3>🌙 مرور شب</h3><div>${ni}</div><label class="f">یادداشت شبانه من</label>${tx(k("night"),4)}</div>
  <div class="card"><div class="row"><div><label class="f">امتیاز امروز من از ۱۰</label>${inp(k("score"),"number")}</div><div><label class="f">حال امروز من</label>${inp(k("mood"))}</div></div>
  <label class="f">فردا فقط این یک چیز را بهتر می‌کنم:</label>${inp(k("tom"))}</div>
  <div class="btns">${n>1?`<button class="btn g" data-v="${n-1}">روز قبل</button>`:`<button class="btn g" data-v="home">شروع</button>`}${n<21?`<button class="btn" data-v="${n+1}">روز بعد</button>`:`<button class="btn" data-v="sum">جمع‌بندی</button>`}</div>`;
}
function sum(){
  return `<div class="head"><div class="sun">پایان</div><div><h2>جمع‌بندی ۲۱ روز</h2><p>قبل و بعد خودت را مقایسه کن؛ دنبال تغییرهای واقعی باش، نه فقط روزهایی که کامل اجرا کردی.</p></div></div>
  <div class="card">${SUM.map(([k,l])=>`<label class="f">${l}</label>${inp(k)}`).join("")}</div>
  <div class="card night"><h3>✉️ نامه من به خودم برای ۹۰ روز آینده</h3>${tx("s.letter",9)}</div>
  <div class="card p" style="text-align:center"><h2 style="font-size:24px">تعهد من بعد از CIP</h2>
  <p>من متعهد می‌شوم که سحرخیزی را فقط یک چالش ۲۱ روزه نبینم. من قرار است آن را به بخشی از سبک زندگی خودم تبدیل کنم و از زمان، انرژی و تمرکزم برای رشد شخصی، حرفه‌ای و مالی استفاده کنم.</p>
  <div class="row"><div><label class="f">نام</label>${inp("s.pn")}</div><div><label class="f">تاریخ</label>${inp("s.pd")}</div></div>
  <label class="f">امضا</label>${inp("s.ps")}
  <p style="margin-top:14px">«هر صبح یک فرصت تازه برای ساختن نسخه بهتر من است.»</p></div>`;
}
function show(v){
  view=v==="home"||v==="sum"?v:+v;
  document.getElementById("main").innerHTML=view==="home"?home():view==="sum"?sum():day(view);
  refresh();scrollTo({top:0})
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)show(b.dataset.v)});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  S[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;save();if(e.target.type==="checkbox")refresh()});
show("home");
</script>
</body>
